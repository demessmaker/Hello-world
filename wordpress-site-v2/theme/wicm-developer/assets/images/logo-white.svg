<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="iconGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="accentGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Music note icon inside rounded square -->
  <rect x="5" y="10" width="80" height="80" rx="18" ry="18" fill="url(#iconGradW)"/>

  <!-- Double beam notes -->
  <g transform="translate(45, 50)">
    <rect x="-16" y="-25" width="3" height="38" rx="1.5" fill="#ffffff"/>
    <rect x="5" y="-20" width="3" height="33" rx="1.5" fill="#ffffff"/>
    <rect x="-16" y="-25" width="24" height="3" rx="1" fill="#ffffff" transform="rotate(-8, -16, -25)"/>
    <rect x="-16" y="-18" width="24" height="3" rx="1" fill="#ffffff" transform="rotate(-8, -16, -18)"/>
    <ellipse cx="-19" cy="15" rx="8" ry="6" transform="rotate(-20, -19, 15)" fill="#ffffff"/>
    <ellipse cx="2" cy="15" rx="8" ry="6" transform="rotate(-20, 2, 15)" fill="#ffffff"/>
  </g>

  <!-- Sound waves -->
  <path d="M72 38 Q78 50, 72 62" stroke="url(#accentGradW)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M78 32 Q86 50, 78 68" stroke="url(#accentGradW)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Text: WEST ISLAND (white for dark bg) -->
  <text x="105" y="42" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#ffffff">WEST ISLAND</text>

  <!-- Text: MUSIC SCHOOL -->
  <text x="105" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="300" letter-spacing="5" fill="#ef4444">MUSIC SCHOOL</text>

  <!-- Accent line -->
  <line x1="105" y1="48" x2="280" y2="48" stroke="url(#accentGradW)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
