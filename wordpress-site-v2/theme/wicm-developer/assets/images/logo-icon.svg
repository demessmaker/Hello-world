<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="20" ry="20" fill="url(#bg)"/>

  <!-- Double beam music notes -->
  <g transform="translate(50, 48)">
    <!-- Stems -->
    <rect x="-18" y="-26" width="3.5" height="40" rx="1.75" fill="#ffffff"/>
    <rect x="8" y="-21" width="3.5" height="35" rx="1.75" fill="#ffffff"/>
    <!-- Beams -->
    <rect x="-18" y="-26" width="29.5" height="3.5" rx="1.2" fill="#ffffff" transform="rotate(-8, -18, -26)"/>
    <rect x="-18" y="-18" width="29.5" height="3.5" rx="1.2" fill="#ffffff" transform="rotate(-8, -18, -18)"/>
    <!-- Note heads -->
    <ellipse cx="-22" cy="16" rx="10" ry="7" transform="rotate(-20, -22, 16)" fill="#ffffff"/>
    <ellipse cx="4" cy="16" rx="10" ry="7" transform="rotate(-20, 4, 16)" fill="#ffffff"/>
  </g>

  <!-- Sound waves -->
  <path d="M72 36 Q80 50, 72 64" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M79 30 Q89 50, 79 70" stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
