name: Tests

on:
  push:
    branches: [jobsearcher, main]
    paths:
      - "job-search-app/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "job-search-app/**"

defaults:
  run:
    working-directory: job-search-app

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: job-search-app/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v
